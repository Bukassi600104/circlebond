type User @table {
  id: String! @col(name: "firebase_uid")
  displayName: String!
  phone: String
  email: String
  profileImage: String
  termsAcceptedAt: Timestamp
  privacyAcceptedAt: Timestamp
  emailNotifications: Boolean! @default(value: true)
  browserPushNotifications: Boolean! @default(value: false)
  commentNotifications: Boolean! @default(value: true)
  contributionReminders: Boolean! @default(value: true)
  circleUpdateNotifications: Boolean! @default(value: true)
  marketingCommunication: Boolean! @default(value: false)
  accountStatus: String! @default(value: "active")
  suspendedAt: Timestamp
  suspensionReasonCode: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type OwnerAdministrator @table(key: ["user"]) {
  user: User!
  role: String! @default(value: "owner")
  status: String! @default(value: "active")
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type OwnerAdminAuditEvent @table {
  id: UUID! @default(expr: "uuidV4()")
  actor: User!
  action: String!
  targetType: String!
  targetId: String!
  purpose: String!
  outcome: String!
  metadata: String! @default(value: "{}")
  createdAt: Timestamp! @default(expr: "request.time")
}

type OperationalEvent @table {
  id: UUID! @default(expr: "uuidV4()")
  category: String!
  eventType: String!
  outcome: String!
  reasonCode: String
  circleId: UUID
  createdAt: Timestamp! @default(expr: "request.time")
}

type PricingPlanDefinition @table(key: ["id"]) {
  id: String!
  circleType: String!
  tier: String!
  version: Int!
  currency: String! @default(value: "NGN")
  priceMinor: Int!
  memberLimit: Int!
  coAdminLimit: Int!
  asoEbiTierLimit: Int! @default(value: 0)
  entitlements: String! @default(value: "[]")
  inclusions: String! @default(value: "[]")
  exclusions: String! @default(value: "[]")
  effectiveAt: Timestamp!
  retiredAt: Timestamp
  createdBy: User
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type AuthAuditEvent @table {
  id: UUID! @default(expr: "uuidV4()")
  userId: String
  event: String!
  channel: String
  outcome: String!
  occurredAt: Timestamp! @default(expr: "request.time")
}

type AbuseAttempt @table {
  id: UUID! @default(expr: "uuidV4()")
  bucketKey: String!
  occurredAt: Timestamp! @default(expr: "request.time")
}

type ConsumedAuthChallenge @table(key: ["challengeHash"]) {
  challengeHash: String!
  consumedAt: Timestamp! @default(expr: "request.time")
}

type Circle @table {
  id: UUID! @default(expr: "uuidV4()")
  creator: User!
  name: String!
  type: String!
  description: String! @default(value: "")
  imageUrl: String
  imageStoragePath: String
  giftTitle: String
  contributionMode: String
  eventType: String
  organizerName: String
  supportType: String
  beneficiaryName: String
  beneficiaryRelationship: String
  showBeneficiaryName: Boolean! @default(value: true)
  showTargetToMembers: Boolean! @default(value: true)
  showConfirmedTotalToMembers: Boolean! @default(value: true)
  hideIndividualAmounts: Boolean! @default(value: true)
  requireCreatorApproval: Boolean! @default(value: false)
  commentsEnabled: Boolean! @default(value: true)
  completionType: String
  paymentBankName: String
  paymentAccountName: String
  paymentAccountNumber: String
  targetAmount: Int!
  contributedAmount: Int! @default(value: 0)
  memberCount: Int! @default(value: 1)
  pricingPlan: String! @default(value: "free")
  memberLimit: Int! @default(value: 3)
  activationPrice: Int! @default(value: 0)
  pricingModelVersion: String! @default(value: "legacy_universal_v1")
  pricingPlanDefinitionId: String
  activationStatus: String! @default(value: "grandfathered")
  activationPriceMinor: Int! @default(value: 0)
  activatedAt: Timestamp
  deadline: Date
  eventDate: Date
  status: String! @default(value: "draft")
  visibility: String! @default(value: "private")
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
  completedAt: Timestamp
  retentionDueAt: Timestamp
  archiveAt: Timestamp
  purgeAt: Timestamp
}

type CreatorTrialUsage @table(key: ["creator"]) {
  creator: User!
  circle: Circle!
  usedAt: Timestamp! @default(expr: "request.time")
}

type CircleActivation @table {
  id: UUID! @default(expr: "uuidV4()")
  circle: Circle!
  creator: User!
  planDefinition: PricingPlanDefinition
  activationType: String!
  circleType: String!
  tier: String!
  currency: String! @default(value: "NGN")
  listPriceMinor: Int!
  amountDueMinor: Int!
  pricePaidMinor: Int! @default(value: 0)
  status: String!
  provider: String
  providerReference: String
  previousActivationId: UUID
  failureCode: String
  createdAt: Timestamp! @default(expr: "request.time")
  paidAt: Timestamp
  activatedAt: Timestamp
}

type PricingChangeAudit @table {
  id: UUID! @default(expr: "uuidV4()")
  actor: User!
  planDefinition: PricingPlanDefinition!
  action: String!
  previousDefinition: String! @default(value: "{}")
  nextDefinition: String!
  effectiveAt: Timestamp!
  createdAt: Timestamp! @default(expr: "request.time")
}

type CircleMembership @table(key: ["circle", "user"]) {
  circle: Circle!
  user: User!
  role: String!
  membershipStatus: String! @default(value: "joined")
  contributionStatus: String! @default(value: "joined")
  expectedAmount: Int! @default(value: 0)
  pledgedAmount: Int! @default(value: 0)
  confirmedAmount: Int! @default(value: 0)
  receiptStoragePath: String
  receiptSubmittedAt: Timestamp
  selectedAsoEbiTier: AsoEbiTier
  fulfilmentStatus: String! @default(value: "joined")
  notificationsMuted: Boolean! @default(value: false)
  joinedAt: Timestamp! @default(expr: "request.time")
}

type Receipt @table {
  id: UUID! @default(expr: "uuidV4()")
  circle: Circle!
  uploadedBy: User!
  amount: Int!
  note: String
  imageUrl: String!
  imageStoragePath: String!
  contentType: String!
  status: String! @default(value: "awaiting_confirmation")
  overpaymentAmount: Int! @default(value: 0)
  replacementOfId: UUID
  rejectionReason: String
  reviewedBy: User
  submittedAt: Timestamp! @default(expr: "request.time")
  reviewedAt: Timestamp
}

type AsoEbiTier @table {
  id: UUID! @default(expr: "uuidV4()")
  circle: Circle!
  name: String!
  price: Int!
  fabricDescription: String!
  fabricImageUrl: String
  fabricImageStoragePath: String
  appreciationGiftName: String
  appreciationGiftImageUrl: String
  appreciationGiftImageStoragePath: String
  availabilityNote: String
  deliveryDetails: String
  sortOrder: Int! @default(value: 0)
  createdAt: Timestamp! @default(expr: "request.time")
}

type SupportUpdate @table {
  id: UUID! @default(expr: "uuidV4()")
  circle: Circle!
  author: User!
  body: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

type Announcement @table {
  id: UUID! @default(expr: "uuidV4()")
  circle: Circle!
  author: User!
  title: String!
  body: String!
  pinned: Boolean! @default(value: false)
  important: Boolean! @default(value: false)
  commentsEnabled: Boolean! @default(value: true)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
  deletedAt: Timestamp
}

type Comment @table {
  id: UUID! @default(expr: "uuidV4()")
  circle: Circle!
  announcementId: UUID
  author: User!
  parentCommentId: UUID
  body: String!
  status: String! @default(value: "visible")
  deletionReason: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
  deletedAt: Timestamp
}

type CommentReport @table {
  id: UUID! @default(expr: "uuidV4()")
  circle: Circle!
  comment: Comment!
  reporter: User!
  reason: String!
  status: String! @default(value: "open")
  createdAt: Timestamp! @default(expr: "request.time")
}

type ActivityLog @table {
  id: UUID! @default(expr: "uuidV4()")
  circle: Circle!
  actor: User
  eventType: String!
  entityId: String!
  metadata: String! @default(value: "{}")
  createdAt: Timestamp! @default(expr: "request.time")
}

type Notification @table {
  id: UUID! @default(expr: "uuidV4()")
  recipient: User!
  circle: Circle
  type: String!
  title: String!
  body: String!
  deepLink: String!
  dedupeKey: String! @unique
  readAt: Timestamp
  dismissedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
}

type EmailDelivery @table {
  id: UUID! @default(expr: "uuidV4()")
  notification: Notification
  recipient: User
  eventType: String!
  destinationMasked: String!
  status: String!
  providerMessageId: String
  failureReason: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type RetentionPurgeAttempt @table {
  id: UUID! @default(expr: "uuidV4()")
  circle: Circle!
  status: String!
  attemptNumber: Int! @default(value: 1)
  deletedFileCount: Int! @default(value: 0)
  skippedSharedFileCount: Int! @default(value: 0)
  failureReason: String
  nextRetryAt: Timestamp
  startedAt: Timestamp! @default(expr: "request.time")
  completedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Invitation @table {
  id: UUID! @default(expr: "uuidV4()")
  circle: Circle!
  invitedBy: User!
  tokenHash: String!
  mode: String!
  recipientName: String
  recipientEmail: String
  recipientPhone: String
  expectedAmount: Int! @default(value: 0)
  requireApproval: Boolean! @default(value: false)
  state: String! @default(value: "created")
  maxUses: Int! @default(value: 1)
  useCount: Int! @default(value: 0)
  expiresAt: Timestamp!
  openedAt: Timestamp
  acceptedAt: Timestamp
  acceptedBy: User
  revokedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type InvitationAcceptance @table(key: ["invitation", "user"]) {
  invitation: Invitation!
  user: User!
  status: String! @default(value: "pending")
  createdAt: Timestamp! @default(expr: "request.time")
  respondedAt: Timestamp
}

type CircleAuditEntry @table {
  id: UUID! @default(expr: "uuidV4()")
  circle: Circle!
  actor: User!
  action: String!
  fromStatus: String
  toStatus: String
  materialChanges: String!
  createdAt: Timestamp! @default(expr: "request.time")
}
