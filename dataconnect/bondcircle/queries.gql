query GetInvitationByTokenHash($tokenHash: String!) @auth(level: NO_ACCESS) {
  invitations(where: { tokenHash: { eq: $tokenHash } }, limit: 1) {
    id
    tokenHash
    mode
    recipientName
    recipientEmail
    recipientPhone
    expectedAmount
    requireApproval
    state
    maxUses
    useCount
    expiresAt
    openedAt
    acceptedAt
    revokedAt
    createdAt
    updatedAt
    circle {
      id
      name
      type
      description
      imageUrl
      memberCount
      memberLimit
      status
      requireCreatorApproval
      contributionMode
      targetAmount
      creator {
        id
        displayName
      }
    }
    invitedBy {
      id
      displayName
    }
    acceptedBy {
      id
    }
  }
}

