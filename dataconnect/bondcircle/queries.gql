  }
}

query GetDeadlineNotificationCandidates($from: Date!, $to: Date!)
@auth(level: NO_ACCESS) {
  circles(
    where: {
      deadline: { ge: $from, le: $to }
      status: { in: ["published", "active", "target_reached", "fulfilment"] }
    }
    limit: 200
  ) {
    id
    name
    type
    deadline
  }
}

query GetUserDeadlineNotificationCandidates($userId: String!)
@auth(level: NO_ACCESS) {
  circleMemberships(
    where: { userId: { eq: $userId }, membershipStatus: { eq: "joined" } }
    limit: 200
  ) {
