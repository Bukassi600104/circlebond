mutation CreateInvitation(
  $circleId: UUID!
  $invitedById: String!
  $tokenHash: String!
  $mode: String!
  $recipientName: String
  $recipientEmail: String
  $recipientPhone: String
  $expectedAmount: Int!
  $requireApproval: Boolean!
  $maxUses: Int!
  $expiresAt: Timestamp!
  $createdAt: Timestamp!
) @auth(level: NO_ACCESS) @transaction {
  invitation_insert(
    data: {
      circle: { id: $circleId }
      invitedBy: { id: $invitedById }
      tokenHash: $tokenHash
      mode: $mode
      recipientName: $recipientName
      recipientEmail: $recipientEmail
      recipientPhone: $recipientPhone
      expectedAmount: $expectedAmount
      requireApproval: $requireApproval
      state: "created"
      maxUses: $maxUses
      useCount: 0
      expiresAt: $expiresAt
      createdAt: $createdAt
      updatedAt: $createdAt
    }
  )
  circleAuditEntry_insert(
    data: {
      circle: { id: $circleId }
      actor: { id: $invitedById }
      action: "invitation_created"
      materialChanges: $mode
      createdAt: $createdAt
    }
  )
  activityLog_insert(
    data: {
      circle: { id: $circleId }
      actor: { id: $invitedById }
      eventType: "member_invited"
      entityId: $invitedById
      metadata: "{}"
      createdAt: $createdAt
    }
  )
}

mutation UpdateInvitationState(
  $invitationId: UUID!
  $actorId: String!
  $circleId: UUID!
  $state: String!
  $openedAt: Timestamp
  $revokedAt: Timestamp
  $updatedAt: Timestamp!
) @auth(level: NO_ACCESS) @transaction {
  invitation_update(
    key: { id: $invitationId }
    data: {
      state: $state
      openedAt: $openedAt
      revokedAt: $revokedAt
