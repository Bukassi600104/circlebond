) @auth(level: NO_ACCESS) {
  notification_updateMany(
    where: { id: { eq: $notificationId }, recipientId: { eq: $recipientId } }
    data: { dismissedAt: $dismissedAt, readAt: $dismissedAt }
  )
}

mutation MarkAllNotificationsRead($recipientId: String!, $readAt: Timestamp!)
@auth(level: NO_ACCESS) {
  notification_updateMany(
    where: {
      recipientId: { eq: $recipientId }
      readAt: { isNull: true }
      dismissedAt: { isNull: true }
    }
    data: { readAt: $readAt }
  )
}

