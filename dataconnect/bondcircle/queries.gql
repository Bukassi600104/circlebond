  $archiveAt: Timestamp
  $purgeAt: Timestamp
) @auth(level: NO_ACCESS) @transaction {
  circle_update(
    key: { id: $circleId }
    data: {
      status: $toStatus
      updatedAt: $updatedAt
      completedAt: $completedAt
      archiveAt: $archiveAt
      purgeAt: $purgeAt
    }
  )
  circleAuditEntry_insert(
    data: {
      circle: { id: $circleId }
      actor: { id: $actorId }
      action: "status_changed"
      fromStatus: $fromStatus
      toStatus: $toStatus
      materialChanges: $toStatus
      createdAt: $updatedAt
    }
  )
}

