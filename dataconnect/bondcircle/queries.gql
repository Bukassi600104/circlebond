query GetCurrentUser @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    displayName
    phone
    email
    profileImage
    termsAcceptedAt
    privacyAcceptedAt
    createdAt
  }
}

mutation UpsertCurrentUser(
  $displayName: String!
  $phone: String
  $email: String
  $profileImage: String
  $termsAcceptedAt: Timestamp
  $privacyAcceptedAt: Timestamp
) @auth(level: USER) {
  user_upsert(
    data: {
      id_expr: "auth.uid"
      displayName: $displayName
      phone: $phone
      email: $email
      profileImage: $profileImage
      termsAcceptedAt: $termsAcceptedAt
      privacyAcceptedAt: $privacyAcceptedAt
    }
  )
}

query GetDashboardCircles @auth(level: NO_ACCESS) {
  circleMemberships(orderBy: { joinedAt: DESC }) {
    role
    membershipStatus
    user {
      id
    }
    circle {
      id
      name
      type
      imageUrl
      targetAmount
      contributedAmount
      showTargetToMembers
      showConfirmedTotalToMembers
      memberCount
      memberLimit
      deadline
      eventDate
      status
      createdAt
      updatedAt
      creator {
        id
      }
    }
  }
}

query GetCircleEngineRecord($circleId: UUID!) @auth(level: NO_ACCESS) {
  circle(key: { id: $circleId }) {
    id
    name
    type
    description
    targetAmount
    pricingPlan
    memberLimit
    activationPrice
    deadline
    eventDate
    status
    visibility
    createdAt
    updatedAt
    completedAt
    retentionDueAt
    archiveAt
    purgeAt
    creator {
      id
    }
  }
  circleMemberships(where: { circleId: { eq: $circleId } }) {
    role
    membershipStatus
    user {
      id
    }
  }
}

query GetCircleLifecycleSummary($circleId: UUID!) @auth(level: NO_ACCESS) {
  circle(key: { id: $circleId }) {
    id
    name
    type
    status
    completionType
    memberCount
    pricingPlan
    createdAt
    completedAt
    retentionDueAt
    archiveAt
    purgeAt
    creator {
      id
    }
  }
  circleMemberships(
    where: { circleId: { eq: $circleId }, membershipStatus: { eq: "joined" } }
  ) {
    user {
      id
    }
  }
  activityLogs(
    where: { circleId: { eq: $circleId } }
    orderBy: { createdAt: DESC }
    limit: 50
  ) {
    id
    eventType
    createdAt
    actor {
      id
      displayName
    }
  }
}

query FindUserByEmail($email: String!) @auth(level: NO_ACCESS) {
