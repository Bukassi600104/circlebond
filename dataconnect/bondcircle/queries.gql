  }
  receipts(
    where: { circleId: { eq: $circleId } }
    orderBy: { submittedAt: DESC }
  ) {
    id
    amount
    note
    imageUrl
    imageStoragePath
    contentType
    status
    overpaymentAmount
    replacementOfId
    rejectionReason
    submittedAt
    reviewedAt
    uploadedBy {
      id
      displayName
    }
    reviewedBy {
      id
      displayName
    }
  }
}

mutation SubmitReceiptWithAudit(
  $receiptId: UUID!
  $circleId: UUID!
  $uploaderId: String!
  $amount: Int!
  $note: String
  $imageUrl: String!
  $imageStoragePath: String!
  $contentType: String!
  $status: String!
  $overpaymentAmount: Int!
  $submittedAt: Timestamp!
) @auth(level: NO_ACCESS) @transaction {
  receipt_insert(
    data: {
      id: $receiptId
      circle: { id: $circleId }
      uploadedBy: { id: $uploaderId }
      amount: $amount
      note: $note
      imageUrl: $imageUrl
      imageStoragePath: $imageStoragePath
      contentType: $contentType
      status: $status
      overpaymentAmount: $overpaymentAmount
      submittedAt: $submittedAt
    }
  )
  circleMembership_update(
    key: { circleId: $circleId, userId: $uploaderId }
    data: {
      contributionStatus: $status
      receiptStoragePath: $imageStoragePath
      receiptSubmittedAt: $submittedAt
    }
  )
  circleAuditEntry_insert(
    data: {
      circle: { id: $circleId }
      actor: { id: $uploaderId }
      action: "receipt_uploaded"
      materialChanges: "receipt_uploaded"
      createdAt: $submittedAt
    }
  )
}

mutation ReplaceReceiptWithAudit(
  $receiptId: UUID!
  $replacedReceiptId: UUID!
  $circleId: UUID!
  $uploaderId: String!
  $amount: Int!
  $note: String
  $imageUrl: String!
  $imageStoragePath: String!
  $contentType: String!
  $status: String!
  $overpaymentAmount: Int!
  $submittedAt: Timestamp!
) @auth(level: NO_ACCESS) @transaction {
  receipt_update(key: { id: $replacedReceiptId }, data: { status: "replaced" })
  receipt_insert(
    data: {
      id: $receiptId
      circle: { id: $circleId }
      uploadedBy: { id: $uploaderId }
      amount: $amount
      note: $note
      imageUrl: $imageUrl
      imageStoragePath: $imageStoragePath
      contentType: $contentType
      status: $status
      overpaymentAmount: $overpaymentAmount
      replacementOfId: $replacedReceiptId
      submittedAt: $submittedAt
    }
  )
  circleMembership_update(
    key: { circleId: $circleId, userId: $uploaderId }
    data: {
      contributionStatus: $status
      receiptStoragePath: $imageStoragePath
      receiptSubmittedAt: $submittedAt
    }
  )
  circleAuditEntry_insert(
    data: {
      circle: { id: $circleId }
      actor: { id: $uploaderId }
      action: "receipt_replaced"
      materialChanges: "receipt_replaced"
      createdAt: $submittedAt
    }
  )
}

mutation ReviewReceiptWithAudit(
  $receiptId: UUID!
  $circleId: UUID!
  $uploaderId: String!
  $reviewerId: String!
  $receiptStatus: String!
  $rejectionReason: String
  $reviewedAt: Timestamp!
  $membershipStatus: String!
  $nextConfirmedAmount: Int!
  $nextCircleContributedAmount: Int!
  $auditAction: String!
  $materialChanges: String!
) @auth(level: NO_ACCESS) @transaction {
  receipt_update(
    key: { id: $receiptId }
    data: {
      status: $receiptStatus
      rejectionReason: $rejectionReason
      reviewedBy: { id: $reviewerId }
      reviewedAt: $reviewedAt
    }
  )
  circleMembership_update(
    key: { circleId: $circleId, userId: $uploaderId }
    data: {
      contributionStatus: $membershipStatus
      confirmedAmount: $nextConfirmedAmount
    }
  )
  circle_update(
    key: { id: $circleId }
    data: {
      contributedAmount: $nextCircleContributedAmount
      updatedAt: $reviewedAt
    }
  )
  circleAuditEntry_insert(
    data: {
      circle: { id: $circleId }
      actor: { id: $reviewerId }
      action: $auditAction
      materialChanges: $materialChanges
      createdAt: $reviewedAt
    }
  )
}

mutation ApproveInvitationMembership(
  $invitationId: UUID!
  $circleId: UUID!
  $actorId: String!
  $userId: String!
  $role: String!
  $expectedAmount: Int!
  $nextMemberCount: Int!
  $nextInvitationState: String!
  $nextUseCount: Int!
  $respondedAt: Timestamp!
) @auth(level: NO_ACCESS) @transaction {
  circleMembership_insert(
    data: {
      circle: { id: $circleId }
      user: { id: $userId }
      role: $role
      membershipStatus: "joined"
      contributionStatus: "joined"
      fulfilmentStatus: "joined"
      expectedAmount: $expectedAmount
      joinedAt: $respondedAt
    }
  )
  invitationAcceptance_update(
    key: { invitationId: $invitationId, userId: $userId }
    data: { status: "accepted", respondedAt: $respondedAt }
  )
  circle_update(
    key: { id: $circleId }
    data: { memberCount: $nextMemberCount, updatedAt: $respondedAt }
  )
  invitation_update(
    key: { id: $invitationId }
    data: {
      state: $nextInvitationState
      useCount: $nextUseCount
      acceptedAt: $respondedAt
      updatedAt: $respondedAt
    }
  )
  circleAuditEntry_insert(
    data: {
      circle: { id: $circleId }
      actor: { id: $actorId }
      action: "membership_approved"
      materialChanges: $userId
      createdAt: $respondedAt
    }
  )
}

mutation DeclineInvitation(
  $invitationId: UUID!
  $circleId: UUID!
  $userId: String!
  $state: String!
  $respondedAt: Timestamp!
) @auth(level: NO_ACCESS) @transaction {
  invitationAcceptance_insert(
    data: {
      invitation: { id: $invitationId }
      user: { id: $userId }
      status: "declined"
      createdAt: $respondedAt
      respondedAt: $respondedAt
    }
  )
  invitation_update(
    key: { id: $invitationId }
    data: { state: $state, updatedAt: $respondedAt }
  )
  circleAuditEntry_insert(
    data: {
      circle: { id: $circleId }
      actor: { id: $userId }
      action: "invitation_declined"
      materialChanges: "invitation_declined"
      createdAt: $respondedAt
    }
  )
}

mutation RequestReplacementInvitation(
