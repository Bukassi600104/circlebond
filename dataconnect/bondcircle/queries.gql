mutation CreateCircleDraft(
  $creatorId: String!
  $name: String!
  $type: String!
  $description: String!
  $targetAmount: Int!
  $pricingPlan: String!
  $memberLimit: Int!
  $activationPrice: Int!
  $deadline: Date
  $eventDate: Date
  $visibility: String!
  $createdAt: Timestamp!
  $updatedAt: Timestamp!
) @auth(level: NO_ACCESS) @transaction {
  circle_insert(
    data: {
      creator: { id: $creatorId }
      name: $name
      type: $type
      description: $description
      targetAmount: $targetAmount
      pricingPlan: $pricingPlan
      memberLimit: $memberLimit
      activationPrice: $activationPrice
      deadline: $deadline
      eventDate: $eventDate
      status: "draft"
      visibility: $visibility
      createdAt: $createdAt
      updatedAt: $updatedAt
    }
  )
  circleMembership_insert(
    data: {
      circleId_expr: "response.circle_insert.id"
      user: { id: $creatorId }
      role: "creator"
      membershipStatus: "joined"
      joinedAt: $createdAt
    }
  )
  circleAuditEntry_insert(
    data: {
      circleId_expr: "response.circle_insert.id"
      actor: { id: $creatorId }
      action: "draft_created"
      toStatus: "draft"
      materialChanges: "{\"status\":\"draft\"}"
      createdAt: $createdAt
    }
  )
}

mutation UpdateCircleConfigurationWithAudit(
