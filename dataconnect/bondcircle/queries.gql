query GetOwnerPlatformOverview @auth(level: NO_ACCESS) {
  totalUsers: users {
    _count
  }
  usersByStatus: users {
    accountStatus
    _count
  }
  totalCircles: circles {
    _count
  }
  circlesByType: circles {
    type
    _count
  }
  circlesByStatus: circles {
    status
    _count
  }
  circlesByPlan: circles {
    pricingPlan
    _count
  }
  invitationTotals: invitations {
    _count
    acceptedAt_count
  }
  uploadOutcomes: operationalEvents(where: { category: { eq: "upload" } }) {
    outcome
    _count
  }
  reportStatuses: commentReports {
    status
    _count
  }
  authOutcomes: authAuditEvents {
    outcome
    _count
  }
  emailOutcomes: emailDeliveries {
    status
    _count
  }
  retentionCandidates: circles(
    where: {
      status: { in: ["completed", "cancelled", "archived"] }
      retentionDueAt: { isNull: false }
      purgeAt: { isNull: true }
    }
  ) {
    _count
  }
  retentionAttempts: retentionPurgeAttempts(
    orderBy: { createdAt: DESC }
    limit: 20
  ) {
    id
    status
    attemptNumber
    deletedFileCount
    skippedSharedFileCount
    failureReason
    nextRetryAt
    startedAt
    completedAt
    circle {
      id
      type
      status
      retentionDueAt
    }
  }
  reportedComments: commentReports(orderBy: { createdAt: DESC }, limit: 50) {
    id
    reason
    status
    createdAt
    reporter {
      id
      displayName
    }
    comment {
      id
      status
      author {
        id
        displayName
        accountStatus
      }
    }
    circle {
      id
      name
      type
    }
  }
  activeInvitations: invitations(
    where: { state: { in: ["created", "opened", "pending_approval"] } }
    orderBy: { createdAt: DESC }
    limit: 50
  ) {
    id
    mode
    state
    useCount
    maxUses
    expiresAt
    createdAt
    circle {
      id
      name
      type
    }
    invitedBy {
      id
      displayName
    }
  }
  recentAdminActions: ownerAdminAuditEvents(
    orderBy: { createdAt: DESC }
    limit: 50
  ) {
    id
    action
    targetType
    targetId
    purpose
    outcome
    metadata
    createdAt
    actor {
      id
      displayName
    }
  }
}

