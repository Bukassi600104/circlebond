query GetCurrentUser @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    displayName
    phone
    email
    profileImage
    termsAcceptedAt
    privacyAcceptedAt
    createdAt
  }
}

mutation UpsertCurrentUser(
  $displayName: String!
  $phone: String
  $email: String
  $profileImage: String
  $termsAcceptedAt: Timestamp
  $privacyAcceptedAt: Timestamp
) @auth(level: USER) {
  user_upsert(
    data: {
      id_expr: "auth.uid"
      displayName: $displayName
      phone: $phone
      email: $email
      profileImage: $profileImage
      termsAcceptedAt: $termsAcceptedAt
      privacyAcceptedAt: $privacyAcceptedAt
    }
  )
}

query GetDashboardCircles @auth(level: NO_ACCESS) {
  circleMemberships(orderBy: { joinedAt: DESC }) {
    role
    membershipStatus
    user {
      id
    }
    circle {
      id
      name
      type
      imageUrl
      targetAmount
      contributedAmount
      showTargetToMembers
      showConfirmedTotalToMembers
      memberCount
      memberLimit
      deadline
      eventDate
      status
      createdAt
      updatedAt
      creator {
        id
      }
    }
  }
}

query GetCircleEngineRecord($circleId: UUID!) @auth(level: NO_ACCESS) {
  circle(key: { id: $circleId }) {
