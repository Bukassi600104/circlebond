query GetRetentionCandidates($now: Timestamp!) @auth(level: NO_ACCESS) {
  circles(
    where: {
      status: { in: ["completed", "cancelled", "archived"] }
      retentionDueAt: { le: $now }
      purgeAt: { isNull: true }
    }
    orderBy: { retentionDueAt: ASC }
    limit: 50
  ) {
    id
    retentionDueAt
  }
}

query GetCircleRetentionPayload($circleId: UUID!) @auth(level: NO_ACCESS) {
  circle(key: { id: $circleId }) {
    id
    type
    status
    retentionDueAt
    purgeAt
    imageStoragePath
  }
  receipts(where: { circleId: { eq: $circleId } }) {
    id
    imageStoragePath
  }
  circleMemberships(where: { circleId: { eq: $circleId } }) {
    receiptStoragePath
  }
  asoEbiTiers(where: { circleId: { eq: $circleId } }) {
    fabricImageStoragePath
    appreciationGiftImageStoragePath
  }
  retentionPurgeAttempts(
    where: { circleId: { eq: $circleId } }
    orderBy: { attemptNumber: DESC }
    limit: 1
  ) {
    attemptNumber
    status
    startedAt
    nextRetryAt
  }
  invitations(where: { circleId: { eq: $circleId } }) {
    id
  }
}

query GetStoragePathReferences($path: String!) @auth(level: NO_ACCESS) {
  circles(where: { imageStoragePath: { eq: $path } }, limit: 2) {
    id
  }
  receipts(where: { imageStoragePath: { eq: $path } }, limit: 2) {
    id
    circle {
      id
    }
  }
  circleMemberships(where: { receiptStoragePath: { eq: $path } }, limit: 2) {
    circle {
      id
    }
  }
  fabricReferences: asoEbiTiers(
    where: { fabricImageStoragePath: { eq: $path } }
    limit: 2
  ) {
    id
    circle {
      id
    }
  }
  giftReferences: asoEbiTiers(
    where: { appreciationGiftImageStoragePath: { eq: $path } }
    limit: 2
  ) {
    id
    circle {
      id
    }
  }
}

mutation CreateRetentionPurgeAttempt(
  $attemptId: UUID!
  $circleId: UUID!
  $attemptNumber: Int!
  $startedAt: Timestamp!
) @auth(level: NO_ACCESS) {
  retentionPurgeAttempt_insert(
    data: {
      id: $attemptId
      circle: { id: $circleId }
      status: "running"
      attemptNumber: $attemptNumber
      startedAt: $startedAt
      createdAt: $startedAt
      updatedAt: $startedAt
    }
  )
}

mutation CompleteRetentionPurgeAttempt(
  $attemptId: UUID!
  $status: String!
  $deletedFileCount: Int!
  $skippedSharedFileCount: Int!
  $failureReason: String
  $nextRetryAt: Timestamp
  $completedAt: Timestamp!
) @auth(level: NO_ACCESS) {
  retentionPurgeAttempt_update(
    key: { id: $attemptId }
    data: {
      status: $status
      deletedFileCount: $deletedFileCount
      skippedSharedFileCount: $skippedSharedFileCount
      failureReason: $failureReason
      nextRetryAt: $nextRetryAt
      completedAt: $completedAt
      updatedAt: $completedAt
    }
  )
}

mutation PurgeInvitationAcceptances($invitationId: UUID!)
@auth(level: NO_ACCESS) {
  invitationAcceptance_deleteMany(
    where: { invitationId: { eq: $invitationId } }
  )
}

mutation PurgeCircleSensitiveData($circleId: UUID!, $purgeAt: Timestamp!)
@auth(level: NO_ACCESS)
@transaction {
  commentReport_deleteMany(where: { circleId: { eq: $circleId } })
  comment_deleteMany(where: { circleId: { eq: $circleId } })
  announcement_deleteMany(where: { circleId: { eq: $circleId } })
  supportUpdate_deleteMany(where: { circleId: { eq: $circleId } })
  receipt_deleteMany(where: { circleId: { eq: $circleId } })
  invitation_deleteMany(where: { circleId: { eq: $circleId } })
  notification_deleteMany(where: { circleId: { eq: $circleId } })
  circleMembership_deleteMany(where: { circleId: { eq: $circleId } })
  asoEbiTier_deleteMany(where: { circleId: { eq: $circleId } })
  circle_update(
    key: { id: $circleId }
    data: {
      name: "Purged circle"
      description: ""
      imageUrl: null
      imageStoragePath: null
      giftTitle: null
      contributionMode: null
      eventType: null
      organizerName: null
      supportType: null
      beneficiaryName: null
      beneficiaryRelationship: null
      paymentBankName: null
      paymentAccountName: null
      paymentAccountNumber: null
      targetAmount: 0
      contributedAmount: 0
      deadline: null
      eventDate: null
      completionType: null
      status: "purged"
      purgeAt: $purgeAt
      updatedAt: $purgeAt
    }
  )
}

