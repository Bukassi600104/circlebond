  $deadline: Date
  $eventDate: Date
  $visibility: String!
  $updatedAt: Timestamp!
  $materialChanges: String!
) @auth(level: NO_ACCESS) @transaction {
  circle_update(
    key: { id: $circleId }
    data: {
      name: $name
      description: $description
      targetAmount: $targetAmount
      pricingPlan: $pricingPlan
      memberLimit: $memberLimit
      activationPrice: $activationPrice
      deadline: $deadline
      eventDate: $eventDate
      visibility: $visibility
      updatedAt: $updatedAt
    }
  )
  circleAuditEntry_insert(
    data: {
      circle: { id: $circleId }
      actor: { id: $actorId }
      action: $action
      fromStatus: $status
      toStatus: $status
      materialChanges: $materialChanges
      createdAt: $updatedAt
    }
  )
}

mutation TransitionCircleWithAudit(
  $circleId: UUID!
  $actorId: String!
  $fromStatus: String!
  $toStatus: String!
