  notification_insert(
    data: {
      id: $notificationId
      recipient: { id: $recipientId }
      circleId: $circleId
      type: $type
      title: $title
      body: $body
      deepLink: $deepLink
      dedupeKey: $dedupeKey
      createdAt: $createdAt
    }
  )
}

mutation MarkNotificationRead(
  $notificationId: UUID!
  $recipientId: String!
  $readAt: Timestamp!
) @auth(level: NO_ACCESS) {
