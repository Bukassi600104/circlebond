mutation AcceptInvitationWithMembership(
  $invitationId: UUID!
  $circleId: UUID!
  $userId: String!
  $role: String!
  $expectedAmount: Int!
  $nextMemberCount: Int!
  $nextInvitationState: String!
  $nextUseCount: Int!
  $respondedAt: Timestamp!
) @auth(level: NO_ACCESS) @transaction {
  circleMembership_insert(
    data: {
      circle: { id: $circleId }
      user: { id: $userId }
      role: $role
      membershipStatus: "joined"
      contributionStatus: "joined"
      fulfilmentStatus: "joined"
      expectedAmount: $expectedAmount
      joinedAt: $respondedAt
    }
  )
  invitationAcceptance_insert(
    data: {
      invitation: { id: $invitationId }
      user: { id: $userId }
      status: "accepted"
      createdAt: $respondedAt
      respondedAt: $respondedAt
    }
  )
  circle_update(
    key: { id: $circleId }
    data: { memberCount: $nextMemberCount, updatedAt: $respondedAt }
  )
  invitation_update(
    key: { id: $invitationId }
    data: {
      state: $nextInvitationState
      useCount: $nextUseCount
      acceptedAt: $respondedAt
      acceptedBy: { id: $userId }
      updatedAt: $respondedAt
    }
  )
  circleAuditEntry_insert(
    data: {
      circle: { id: $circleId }
      actor: { id: $userId }
      action: "invitation_accepted"
      materialChanges: "invitation_accepted"
      createdAt: $respondedAt
    }
  )
}

mutation RequestInvitationApproval(
