mutation ResolveOwnerCommentReport(
  $reportId: UUID!
  $reportStatus: String!
  $commentId: UUID!
  $commentStatus: String!
  $deletionReason: String
  $updatedAt: Timestamp!
) @auth(level: NO_ACCESS) @transaction {
  commentReport_update(key: { id: $reportId }, data: { status: $reportStatus })
  comment_update(
    key: { id: $commentId }
    data: {
      status: $commentStatus
      deletionReason: $deletionReason
      updatedAt: $updatedAt
      deletedAt: $updatedAt
    }
  )
