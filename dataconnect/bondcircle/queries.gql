query GetCircleCommunication($circleId: UUID!) @auth(level: NO_ACCESS) {
  circle(key: { id: $circleId }) {
    id
    name
    type
    status
    commentsEnabled
    creator {
      id
    }
  }
  circleMemberships(
    where: { circleId: { eq: $circleId } }
    orderBy: { joinedAt: ASC }
  ) {
    role
    membershipStatus
    expectedAmount
    confirmedAmount
    user {
      id
      displayName
      profileImage
    }
  }
  announcements(
    where: { circleId: { eq: $circleId }, deletedAt: { isNull: true } }
    orderBy: [{ pinned: DESC }, { createdAt: DESC }]
    limit: 100
  ) {
    id
    title
    body
    pinned
    important
    commentsEnabled
    createdAt
    updatedAt
    author {
      id
      displayName
    }
  }
  comments(
    where: { circleId: { eq: $circleId } }
    orderBy: { createdAt: ASC }
    limit: 300
  ) {
    id
    announcementId
    parentCommentId
    body
    status
    deletionReason
    createdAt
    updatedAt
    deletedAt
    author {
      id
      displayName
      profileImage
    }
  }
  commentReports(
    where: { circleId: { eq: $circleId }, status: { eq: "open" } }
    orderBy: { createdAt: DESC }
    limit: 100
  ) {
    id
    reason
    status
    createdAt
    comment {
      id
    }
    reporter {
      id
      displayName
    }
  }
  activityLogs(
    where: { circleId: { eq: $circleId } }
    orderBy: { createdAt: DESC }
    limit: 200
  ) {
    id
    eventType
    entityId
    metadata
    createdAt
    actor {
      id
      displayName
    }
  }
}

