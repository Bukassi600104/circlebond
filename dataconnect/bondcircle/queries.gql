      id
      name
      type
      description
      imageUrl
      memberCount
      memberLimit
      status
      requireCreatorApproval
      contributionMode
      targetAmount
      creator {
        id
        displayName
      }
    }
    invitedBy {
      id
      displayName
    }
    acceptedBy {
      id
    }
  }
}

